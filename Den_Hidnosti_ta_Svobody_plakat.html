<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>День Гідності та Свободи — 21 листопада 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a2a66;--blue:#1b5fc7;--gold:#ffd43b;--ink:#0d1b3a;--paper:#f7f9ff}
*{box-sizing:border-box}
body{margin:0;background:#06173a;color:var(--ink);font:400 17px/1.55 'Nunito',system-ui,'Segoe UI',Arial,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--navy);box-shadow:0 0 0 6px var(--gold)}
.poster{position:relative;max-width:1600px;margin:0 auto}
.poster img{display:block;width:100%;height:auto}
.menu{position:absolute;left:2%;right:2%;bottom:3.5%;display:grid;grid-template-columns:repeat(6,1fr);gap:.8%}
.menu button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.7vw .5vw;color:#fff;text-align:center;
 font-weight:800;font-size:clamp(11px,1.12vw,18px);line-height:1.2;background:rgba(8,30,80,.78);
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:2px solid rgba(255,212,59,.85);border-radius:12px;
 transition:transform .15s,background .15s,color .15s;animation:rise .6s both}
.menu button:nth-child(2){animation-delay:.08s}.menu button:nth-child(3){animation-delay:.16s}
.menu button:nth-child(4){animation-delay:.24s}.menu button:nth-child(5){animation-delay:.32s}.menu button:nth-child(6){animation-delay:.4s}
.menu .em{font-size:1.9em}
.menu button:hover{background:var(--gold);color:var(--navy);transform:translateY(-4px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.hint{display:none}
@media(max-width:860px){
 .menu{position:static;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:var(--navy)}
 .menu button{font-size:15px;padding:12px 8px}
 .hint{display:block;margin:0;padding:0 14px 16px;background:var(--navy);color:#cfe0ff;text-align:center;font-size:14px}
}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(4,15,40,.8)}
.ov[hidden]{display:none}
.panel{display:flex;flex-direction:column;width:min(980px,100%);max-height:92vh;overflow:hidden;background:var(--paper);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--navy);color:#fff;border-bottom:6px solid var(--gold)}
.ph h2{margin:0;font:400 clamp(24px,3.6vw,38px)/1.15 'Marck Script',cursive}
.x{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px}
.x:hover{background:var(--gold);color:var(--navy)}
#pb{padding:20px;overflow:auto}
#pb h3{margin:22px 0 8px;font-size:19px;color:var(--navy)}
.lead{margin:0 0 14px;font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border:2px solid var(--blue);border-radius:10px;background:#fff;color:var(--navy);font-weight:700}
.chip:hover{background:#e6efff}
.chip.on{background:var(--blue);color:#fff}
.card{margin-top:14px;padding:14px 18px;background:#fff;border-left:6px solid var(--gold);border-radius:10px;box-shadow:0 1px 4px rgba(10,42,102,.15)}
.card h4{margin:0 0 6px;font-size:20px;color:var(--navy)}
.card p{margin:0}
.btn{padding:10px 18px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800}
.btn:hover{background:var(--navy)}
.btn[disabled],.btn.off{background:#b9c3d8;color:#4a5670;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.three .card{margin:0;border-left:0;border-top:6px solid var(--blue)}
.three .card:nth-child(2){border-top-color:var(--gold)}
.fc{perspective:900px;height:150px;padding:0;border:0;background:none;text-align:left}
.fi{position:relative;display:block;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.on .fi{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.fc .f{background:var(--blue);color:#fff;font:400 26px 'Marck Script',cursive}
.fc .b{background:var(--gold);color:var(--navy);font-weight:700;transform:rotateY(180deg)}
.law{margin-top:14px;padding:12px 16px;background:#e8f0ff;border-radius:10px;font-size:16px}
details{margin-top:8px;padding:10px 14px;background:#fff;border-radius:10px;border:1px solid #c8d6f2}
summary{cursor:pointer;font-weight:700;color:var(--navy)}
.sym{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sym .chip{display:flex;flex-direction:column;align-items:center;padding:12px 6px}
.sym .em{font-size:34px;line-height:1.1}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{padding:11px 14px;border:2px solid #c3d2f0;border-radius:10px;background:#fff;text-align:left;font-weight:700;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{background:#dff5e1;border-color:#2e9e45}
.opt.no{background:#fde4e4;border-color:#d64545}
.bar{height:8px;margin-bottom:14px;border-radius:4px;background:#d7e2f7;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .3s}
.big{font-size:44px;font-weight:800;color:var(--navy);margin:0}
input[type=text]{width:100%;max-width:420px;padding:10px 12px;border:2px solid #c3d2f0;border-radius:10px;font:inherit}
.pledge{margin-top:16px;padding:20px 22px;border-radius:14px;background:linear-gradient(180deg,var(--blue) 0 50%,var(--gold) 50% 100%);color:#fff}
.pledge .in{padding:16px 18px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:10px}
.pledge h4{margin:0 0 8px;font:400 28px 'Marck Script',cursive;color:var(--navy)}
.pledge ul{margin:6px 0 0;padding-left:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <button data-s="videos"><span class="em">🎬</span><span>Історичні відеоматеріали</span></button>
  <button data-s="quiz"><span class="em">🧠</span><span>Перевір свої знання</span></button>

<div class="ov" id="ov" hidden>
 <section class="panel" role="dialog" aria-modal="true" aria-labelledby="pt">
  <header class="ph"><h2 id="pt"></h2><button class="x" id="cl" aria-label="Закрити">✕</button></header>
  <div id="pb"></div>
 </section>
</div>

<script>
/* ===== ДЛЯ ВЧИТЕЛЯ: вставте посилання на відео між лапками url:"" =====
   Поки url порожній, кнопка показує «Посилання додасть учитель». */
const VIDEOS=[
 {title:"Хроніка Революції Гідності",desc:"Короткий огляд подій листопада 2013 — лютого 2014 року.",task:"Запиши три події, які тобі запам’яталися, і дату кожної.",url:"https://youtu.be/Qv26c9mUW3M?si=1-2d8ViT6oJWWn9B"},
 {title:"Свідчення учасників Майдану",desc:"Розповіді людей, які були на Майдані.",task:"Що, на думку учасників, змусило їх вийти на Майдан?",url:"https://youtu.be/R3weBSE8Rb4?si=8KeKbQbs8DH1xqc1"},
 {title:"Небесна сотня: пам’ять",desc:"Відео про героїв, які загинули в лютому 2014 року.",task:"Як українці зберігають пам’ять про Небесну сотню?",url:"https://youtu.be/yS-syMs8-_I?si=xHnfgkyv2DJ8fxr2"},
 {title:"Від Майдану до сьогодення",desc:"Як події 2013–2014 років пов’язані з сучасною боротьбою за свободу.",task:"Поясни одним реченням, чому цей день важливий сьогодні.",url:"https://youtu.be/-y2eYVxDKiE?si=BhA3m-6-5jGI3jAw"}
];

const EV=[
{d:"21 листопада 2013",t:"Уряд зупинив шлях до Європи",x:"Кабінет міністрів призупинив підготовку до підписання Угоди про асоціацію з Європейським Союзом. Того ж вечора журналіст Мустафа Найєм закликав людей зібратися на Майдані Незалежності. Прийшли студенти, активісти, звичайні кияни — так розпочався Євромайдан."},
{d:"30 листопада 2013",t:"Побиття студентів",x:"Серед ночі спецпідрозділ «Беркут» силою розігнав мирних протестувальників, переважно студентів. Наступного дня, 1 грудня, на Майдан вийшли сотні тисяч людей. Протест став загальнонаціональним."},
{d:"16 січня 2014",t:"«Диктаторські закони»",x:"Верховна Рада з порушенням процедури, голосуванням підняттям рук, ухвалила закони, що обмежували свободу зібрань, слова й діяльність громадських організацій. Люди сприйняли це як спробу зупинити протест силою закону."},
{d:"22 січня 2014",t:"Перші загиблі",x:"Під час зіткнень на вулиці Грушевського в Києві загинули перші учасники протестів. Після цього протест не вщух, а лише посилився."},
{d:"18–20 лютого 2014",t:"Найтрагічніші дні",x:"У центрі Києва стріляли в людей. Загинули понад сто учасників протестів — їх називають Небесною сотнею. Також були загиблі серед правоохоронців."},
{d:"22 лютого 2014",t:"Перемога революції",x:"Президент Віктор Янукович залишив Київ, а Верховна Рада констатувала його самоусунення від влади. Українці відстояли право самим обирати майбутнє своєї країни."},
{d:"21 листопада 2014",t:"З’явилося свято",x:"Указом Президента встановлено День гідності та свободи — на згадку про Помаранчеву революцію 2004 року та Революцію Гідності 2013–2014 років. Після перемоги революції Росія розпочала агресію проти України: окупувала Крим і почала війну на Донбасі. Відтоді українці відстоюють свою свободу й гідність."}
];

const SYM=[
{e:"🇺🇦",n:"Прапор",x:"Синьо-жовтий прапор затверджено Державним прапором України 28 січня 1992 року. Часто кажуть, що синій — це мирне небо, а жовтий — пшеничне поле. Прапори були всюди на Майдані — як знак єдності."},
{e:"🔱",n:"Тризуб",x:"Малий Державний Герб — Знак Княжої Держави Володимира Великого — затверджено 19 лютого 1992 року. Подібні знаки карбували ще на монетах князя Володимира, тож тризуб пов’язує сучасну Україну з її давньою історією."},
{e:"🎵",n:"Гімн",x:"Слова «Ще не вмерла Україна» написав Павло Чубинський у 1862 році, музику створив Михайло Вербицький. У першому рядку гімну слава України стоїть поруч із волею. На Майдані гімн співали тисячі людей разом."},
{e:"🏙️",n:"Майдан Незалежності",x:"Головна площа Києва. Тут відбулися Революція на граніті (1990), Помаранчева революція (2004) та Революція Гідності (2013–2014). У центрі площі стоїть Монумент Незалежності з фігурою Берегині."},
{e:"🕯️",n:"Небесна сотня",x:"Так називають загиблих учасників Революції Гідності. У Києві на вулиці Інститутській є Алея Героїв Небесної Сотні — люди приносять туди квіти й запалюють свічки."},
{e:"🌻",n:"Соняшник",x:"Соняшник — один із найвідоміших образів України: це сонце, літо й життя. Після 2022 року він став знаком підтримки України в усьому світі."}
];

const QZ=[
{q:"Що стало приводом для початку протестів на Майдані 21 листопада 2013 року?",a:"Призупинення підготовки до підписання Угоди про асоціацію з ЄС",w:["Підвищення цін на проїзд","Закриття університетів","Скасування виборів мера Києва"],e:"Саме це рішення уряду змусило людей вийти на Майдан."},
{q:"Як називають загиблих учасників Революції Гідності?",a:"Небесна сотня",w:["Золота варта","Біла дружина","Вічна когорта"],e:"Понад сто людей загинули в лютому 2014 року."},
{q:"Коли відзначають День гідності та свободи?",a:"21 листопада",w:["24 серпня","22 січня","20 лютого"],e:"21 листопада 2013 року почався Євромайдан."},
{q:"Про які події нагадує це свято?",a:"Помаранчеву революцію 2004 року та Революцію Гідності 2013–2014 років",w:["Проголошення Універсалів УНР","Чорнобильську аварію","Початок Другої світової війни"],e:"Свято об’єднує пам’ять про обидва великі виступи за свободу."},
{q:"Яке слово в першому рядку гімну стоїть поруч зі словом «слава»?",a:"Воля",w:["Сила","Честь","Правда"],e:"«Ще не вмерла України і слава, і воля»."},
{q:"Де відбулися головні події Революції Гідності?",a:"На Майдані Незалежності в Києві",w:["На Софійській площі у Львові","На Хрещатику в Харкові","На Контрактовій площі в Одесі"],e:"Протести охопили всю країну, але центром був Майдан Незалежності."}
];

const PLEDGE=["🕯️ Пам’ятатиму героїв і розповідатиму про них","🤝 Поважатиму кожного — і в школі, і в мережі","🔎 Перевірятиму інформацію, перш ніж поширювати","📚 Вивчатиму історію своєї країни й родини","💛 Допомагатиму тим, кому потрібна підтримка","🗣️ Не мовчатиму, коли когось ображають"];

const $=s=>document.querySelector(s), pb=$("#pb");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const S={
history:{t:"📜 Історія Революції Гідності",r(){
 let i=0;
 pb.innerHTML=`<p class="lead">Обери дату — і дізнайся, що тоді сталося.</p><div class="row" id="tl">${EV.map((e,k)=>`<button class="chip" data-k="${k}">${e.d}</button>`).join("")}</div><article class="card" id="ev" aria-live="polite"></article><p style="margin-top:12px"><button class="btn" id="nx">Далі</button></p>
 <h3>Це був не перший Майдан</h3><div class="grid three">
 <div class="card"><h4>1990</h4><p><b>Революція на граніті.</b> Студенти вийшли на голодування й вимагали, зокрема, відставки уряду та відмови від підписання нового союзного договору.</p></div>
 <div class="card"><h4>2004</h4><p><b>Помаранчева революція.</b> Тисячі людей протестували проти фальсифікацій на виборах Президента. Друге голосування відбулося 26 грудня 2004 року.</p></div>
 <div class="card"><h4>2013–2014</h4><p><b>Революція Гідності.</b> Протест за європейський вибір України перетворився на боротьбу за гідність, права й свободу людини.</p></div></div>`;
 const show=k=>{i=k;[...document.querySelectorAll("#tl .chip")].forEach((b,n)=>b.classList.toggle("on",n==k));
  $("#ev").innerHTML=`<h4>${EV[k].d}: ${EV[k].t}</h4><p>${EV[k].x}</p>`;$("#nx").textContent=k<EV.length-1?"Далі":"На початок"};
 $("#tl").onclick=e=>{const b=e.target.closest("[data-k]");if(b)show(+b.dataset.k)};
 $("#nx").onclick=()=>show((i+1)%EV.length);show(0);}},

dignity:{t:"🕊️ Що означає гідність?",r(){
 const C=[["Повага до себе","Не погоджуватися на приниження — ні від кого й ніколи."],["Повага до інших","Гідність є в кожної людини, тому до кожного ставимося чесно й з повагою."],["Свобода вибору","Право самому вирішувати, як жити, що думати й що казати."],["Чесність","Діяти за своїми переконаннями, навіть коли це непросто."],["Єдність","Разом легше відстояти свої права й допомогти тим, хто поруч."]];
 pb.innerHTML=`<p class="lead">Гідність — це відчуття власної цінності й повага до цінності кожної людини. Натисни на картку, щоб прочитати, що це означає.</p>
 <div class="grid">${C.map(c=>`<button class="fc" aria-pressed="false"><span class="fi"><span class="f">${c[0]}</span><span class="b">${c[1]}</span></span></button>`).join("")}</div>
 <div class="law"><b>У Конституції України.</b> Стаття 3: людина, її життя і здоров’я, честь і гідність визнаються в Україні найвищою соціальною цінністю. Стаття 28: кожен має право на повагу до його гідності.</div>
 <h3>Обговоримо</h3>
 <details><summary>Чому ту революцію назвали саме Революцією Гідності?</summary><p>Подумай: чого вимагали люди, коли їх побили, а потім ухвалили закони проти протестів?</p></details>
 <details><summary>Як у школі можна показати повагу до гідності іншої людини?</summary><p>Згадай конкретні слова й вчинки: як підтримати, а не висміяти.</p></details>
 <details><summary>Коли ти відстоював(-ла) свою гідність або гідність когось іншого?</summary><p>Поділися прикладом з класом, якщо хочеш.</p></details>`;
 pb.querySelectorAll(".fc").forEach(b=>b.onclick=()=>{b.classList.toggle("on");b.setAttribute("aria-pressed",b.classList.contains("on"))});}},

symbols:{t:"🇺🇦 Символи свободи",r(){
 pb.innerHTML=`<p class="lead">Обери символ, щоб дізнатися його історію.</p><div class="sym">${SYM.map((s,k)=>`<button class="chip" data-k="${k}"><span class="em">${s.e}</span>${s.n}</button>`).join("")}</div><article class="card" id="sd" aria-live="polite"><p>Натисни на символ вище.</p></article>`;
 pb.querySelector(".sym").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;
  pb.querySelectorAll(".sym .chip").forEach(x=>x.classList.toggle("on",x===b));const s=SYM[+b.dataset.k];
  $("#sd").innerHTML=`<h4>${s.e} ${s.n}</h4><p>${s.x}</p>`}}},

videos:{t:"🎬 Історичні відеоматеріали",r(){
 pb.innerHTML=`<p class="lead">Переглянь відео та виконай завдання до нього.</p><div class="grid">${VIDEOS.map(v=>`<div class="card" style="margin:0"><h4>${v.title}</h4><p>${v.desc}</p><p style="margin:8px 0"><b>Завдання:</b> ${v.task}</p>${v.url?`<a class="btn" style="display:inline-block;text-decoration:none" href="${v.url}" target="_blank" rel="noopener">▶ Дивитися</a>`:`<span class="btn off" style="display:inline-block">Посилання додасть учитель</span>`}</div>`).join("")}</div>`;}},

quiz:{t:"🧠 Перевір свої знання",r(){
 let n=0,sc=0;
 const go=()=>{
  if(n>=QZ.length){const p=sc/QZ.length;
   pb.innerHTML=`<p class="big">${sc} з ${QZ.length}</p><p class="lead">${p==1?"Чудово! Ти добре знаєш історію Революції Гідності.":p>=.5?"Гарний результат! Перечитай розділ «Історія», щоб дізнатися ще більше.":"Це лише початок. Відкрий розділ «Історія» й спробуй ще раз."}</p><button class="btn" id="re">Пройти ще раз</button>`;
   $("#re").onclick=()=>{n=0;sc=0;go()};return}
  const q=QZ[n],o=sh([{t:q.a,ok:1},...q.w.map(t=>({t}))]);
  pb.innerHTML=`<div class="bar"><i style="width:${n/QZ.length*100}%"></i></div><p><b>Питання ${n+1} з ${QZ.length}</b></p><p class="lead">${q.q}</p><div class="opts">${o.map((x,k)=>`<button class="opt" data-k="${k}">${x.t}</button>`).join("")}</div><div id="fb" aria-live="polite"></div>`;
  pb.querySelector(".opts").onclick=e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;
   const ok=o[+b.dataset.k].ok;if(ok)sc++;
   pb.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(o[k].ok)x.classList.add("ok")});if(!ok)b.classList.add("no");
   $("#fb").innerHTML=`<div class="card"><p><b>${ok?"Правильно!":"Не зовсім."}</b> ${q.e}</p></div><p><button class="btn" id="nq">${n<QZ.length-1?"Далі":"Результат"}</button></p>`;
   $("#nq").onclick=()=>{n++;go()};$("#nq").focus()}};
 go();}},

pledge:{t:"💙💛 Мій внесок у вільну Україну",r(){
 pb.innerHTML=`<p class="lead">Свобода починається з маленьких кроків. Обери, що ти можеш робити, і створи свою обіцянку.</p>
 <div class="row" id="pc">${PLEDGE.map((p,k)=>`<button class="chip" data-k="${k}" aria-pressed="false">${p}</button>`).join("")}</div>
 <h3>Моя власна обіцянка</h3><input type="text" id="own" maxlength="120" placeholder="Напиши своїми словами">
 <h3>Моє ім’я</h3><input type="text" id="nm" maxlength="40" placeholder="Ім’я">
 <p style="margin-top:14px"><button class="btn" id="mk">Створити мою обіцянку</button></p><div id="out"></div>`;
 $("#pc").onclick=e=>{const b=e.target.closest(".chip");if(b){b.classList.toggle("on");b.setAttribute("aria-pressed",b.classList.contains("on"))}};
 $("#mk").onclick=()=>{
  const it=[...document.querySelectorAll("#pc .on")].map(b=>b.textContent),o=$("#own").value.trim(),nm=$("#nm").value.trim()||"Учень України";
  if(o)it.push("✍️ "+o);
  if(!it.length){$("#out").innerHTML=`<div class="card"><p>Обери хоча б один пункт або напиши власну обіцянку.</p></div>`;return}
  const txt=`Я, ${nm}, обираю гідність і свободу. Мій внесок у вільну Україну:\n`+it.map(x=>"• "+x).join("\n");
  $("#out").innerHTML=`<div class="pledge"><div class="in"><h4></h4><ul></ul></div></div><p><button class="btn" id="cp">Скопіювати текст</button> <span id="cm"></span></p>`;
  $("#out h4").textContent=`Я, ${nm}, обираю гідність і свободу`;
  it.forEach(x=>{const li=document.createElement("li");li.textContent=x;$("#out ul").append(li)});
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(txt);$("#cm").textContent="Скопійовано!"}catch(_){$("#cm").textContent="Не вдалося скопіювати — зробіть знімок екрана."}};
  $("#out").scrollIntoView({behavior:"smooth",block:"nearest"})}}}
};

let last=null;
const open=(k,btn)=>{last=btn;$("#pt").textContent=S[k].t;S[k].r();pb.scrollTop=0;$("#ov").hidden=false;$("#cl").focus()};
const close=()=>{$("#ov").hidden=true;if(last)last.focus()};
document.querySelectorAll(".menu button").forEach(b=>b.onclick=()=>open(b.dataset.s,b));
$("#cl").onclick=close;
$("#ov").onclick=e=>{if(e.target.id=="ov")close()};
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&!$("#ov").hidden)close()});
</script>
</body>
</html>
