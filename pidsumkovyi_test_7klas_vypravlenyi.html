<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Підсумковий тест. Історія, 7 клас, ч. 3–4</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#23262b;--mut:#6a6f78;--ac:#2f6f4f;--acs:#e3f1e9;--ok:#2e7d32;--oks:#e4f4e5;--bad:#b3261e;--bads:#fbe9e7;--bd:#d9d5c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1d1b;--card:#242826;--tx:#e8e8e3;--mut:#a0a59f;--ac:#6fcf97;--acs:#26382e;--ok:#81c784;--oks:#243a26;--bad:#ef9a9a;--bads:#40262a;--bd:#3a403c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1d1b;--card:#242826;--tx:#e8e8e3;--mut:#a0a59f;--ac:#6fcf97;--acs:#26382e;--ok:#81c784;--oks:#243a26;--bad:#ef9a9a;--bads:#40262a;--bd:#3a403c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2em 0}h2{font-size:1.05rem;margin:.1em 0 .6em;color:var(--ac)}
.sub{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.note{background:var(--acs);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:.93rem}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 11px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.opt.ok{background:var(--oks);border-color:var(--ok)}.opt.bad{background:var(--bads);border-color:var(--bad)}
.row{padding:8px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}.row p{margin:0 0 6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;align-items:center}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--card);color:var(--ac);cursor:pointer;font:inherit;font-weight:600}
.btn.p{background:var(--ac);color:var(--bg)}
.fb{font-size:.9rem;color:var(--mut);margin-top:4px}
select,textarea,input[type=text]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.row select,.self,.btns select{width:auto;min-width:100px}
textarea{min-height:70px}
canvas{width:100%;border:1px solid var(--bd);border-radius:8px;touch-action:none;background:#fff;display:block}
.im{max-width:100%;border-radius:8px;margin:6px 0;display:block}
.big{font-size:1.4rem;color:var(--ac)}
small{color:var(--mut);font-weight:400}
</style>
</head>

{ty:"pick",q:"Установи, яка подія в історії Києво-Руської держави відбулася 957 року.",o:["Поїздка княгині Ольги до Константинополя та її зустріч із імператором Костянтином VII Багрянородним","«Благословення» апостолом Андрієм Первозваним Київських гір","Похід київських князів Аскольда й Діра на Константинополь","Укладення торговельної угоди з Візантійською імперією"],a:0,p:1},
{ty:"pick",q:"Продовж речення. Держави, створені неримськими народами (насамперед германськими) на території Західної Римської імперії в умовах її розпаду в V столітті, історики називають…",o:["варварськими королівствами","середньовічними імперіями","торговими республіками","першими цивілізаціями"],a:0,p:1},
{ty:"match",q:"Установи відповідність між історичними подіями (явищами, процесами) та їхніми результатами.",l:["1. Поширення майнової нерівності","2. Торговельні угоди з Візантією","3. Розвиток ремесла й торгівлі","4. Накладення данини"],o:["Установлення політичної залежності","Виникнення та розбудова міст","Міжнародне визнання Русі","Поширення християнства","Вождівство"],a:[4,2,1,0],p:4},
{ty:"match",q:"Установи послідовність подій, відображених у витягах з історичних джерел.",l:["Місце 1 (перша подія)","Місце 2","Місце 3","Місце 4 (остання подія)"],o:["«І послали кияни [гінця] до Святослава, говорячи: „Ти, княже, чужої землі шукаєш і дбаєш [про неї], а свою полишив”»","«Й ось імператор [Юстиніан I] з усією запопадливістю розпочав будівництво, не шкодуючи жодних засобів <...>. Цей храм був чудесним видовищем»","«І зійшов він на гори сі, і благословив їх, і поставив хреста. І, поклонившись Богу, він спустився з гори сеї, де опісля постав Київ»","«І прибули [Олег та Ігор] до гір київських, і довідався Олег, що [тут] Аскольд і Дір удвох княжать»"],a:[2,1,3,0],p:3},
{ty:"match",q:"Розпізнай руських князів / княгиню за їхніми характеристиками.",l:["1. Олег","2. Ігор","3. Ольга","4. Святослав"],o:["Воював з болгарами, хозарами, печенігами, планував наступати на Візантію; у Києві бував рідко та й загалом, здається, не надто любив це місто, бо навіть намагався перенести столицю в Переяславець на Дунаї, який уважав великим торговим центром і чомусь «серединою» своєї землі","Збір данини з підвладних земель був основним заняттям князя та дружини; першими збунтувалися древляни, тож проти них організовано військовий похід і знову підвищено данину; загалом, здається, він не знав міри в накопиченні багатств, що врешті-решт погано скінчилося","Літописні описи помсти непокірним древлянам переплетені з фольклорними матеріалами та не можуть уважатися достовірними, однак безсумнівним є факт спалення древлянської столиці Іскоростеня; після цього, утім, сплату данини було впорядковано","Найбільшим політичним успіхом був похід на Константинополь (Царгород) 907 року, для якого вдалося зібрати велике сухопутне військо та флот; результатами стали договори Русі з Візантією, що забезпечували сприятливі умови руським купцям у Візантії, а візантійським — на теренах Русі","Представниця полянської князівської династії, яку разом із братами Києм, Щеком і Хоривом уважають, згідно з легендою, засновницею Києва; її мистецький образ утілено в пам’ятнику, установленому в Києві до 1500-річчя міста"],a:[3,1,2,0],p:4},
{ty:"multi",q:"Укажи три характерні ознаки варварських королівств.",o:["Наявність міст-держав, що разом із прилеглою сільською територією творили поліси.","Зосередження влади в руках ватажків племен або військових командирів.","Поділ населення на племена венедів, антів та склавинів.","Внутрішня нестабільність через відсутність усталених правил престолонаступництва.","Перевага арабо-мусульманської культури.","Часті зміни політичних центрів (столиць) і територіальних меж.","Поширення «звіриного» стилю в мистецтві."],a:[1,3,5],p:3},
{ty:"map",q:"Виконай завдання до контурної карти.",s:[["7.1. Окресли кордони Києво-Руської держави 945 року.",1,MK1],["7.2. Познач міста Київ і Константинополь (Царгород).",1,"Київ — на Дніпрі; Константинополь (Царгород) — на протоці Босфор. Кожну позначку підпиши."],["7.3. Познач сусідні держави та племена (племінні об’єднання) східних слов’ян.",1,"Орієнтир (звір з атласом): сусіди — Візантія, Хозарський каганат, Волзька Болгарія, печеніги, угри; племена — поляни, древляни, сіверяни, радимичі, в’ятичі, кривичі, дреговичі, уличі, тиверці, дуліби, білі хорвати, ільменські словени."]],p:3},
{ty:"open",q:"Розглянь зображення та виконай завдання.",img:"c",s:[["8.1. Розпізнай зображення.",1,"Карл Великий (золотий бюст-реліквіарій) та Аахенський собор (Палатинська капела)."],["8.2. Установи, що об’єднує ці зображення.",2,"Обидва пов’язані з Карлом Великим і Франкським королівством (імперією): Аахен був його улюбленою резиденцією та центром імперії, там він збудував палац і капелу."],["8.3. Опиши кількома реченнями історичну ситуацію, у якій діяла зображена постать / зводилася зображена споруда.",2,"Карл Великий (768–814) завоюваннями розширив Франкське королівство; у 800 р. папа Римський коронував його імператором. В Аахені збудовано палацовий комплекс із капелою, місто стало центром «Каролінзького відродження» (розвиток освіти й культури)."]],p:5}

// Працює і в file://, де navigator.clipboard часто недоступний.
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  const area=document.createElement("textarea");
  area.value=text;
  area.setAttribute("readonly","");
  area.style.position="fixed";
  area.style.left="-9999px";
  area.style.top="0";
  document.body.appendChild(area);
  area.focus();
  area.select();
  let ok=false;
  try{ok=document.execCommand("copy")}catch(e){}
  area.remove();
  return ok;
}
