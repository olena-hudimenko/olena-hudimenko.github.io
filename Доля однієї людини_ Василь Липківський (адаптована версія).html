<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Доля однієї людини: Василь Липківський</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1d;--mute:#555;--line:#cfc9ba;--acc:#8a2b2b;--ok:#1f6b45;--okbg:#e2f3e9;--bad:#a4262c;--badbg:#fbe4e4;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#222126;--ink:#f1eee8;--mute:#b5b2ab;--line:#47444c;--acc:#e8938b;--ok:#7fe0a8;--okbg:#1d3a2b;--bad:#ff9a9a;--badbg:#401f21}}
:root[data-theme="dark"]{--bg:#17161a;--card:#222126;--ink:#f1eee8;--mute:#b5b2ab;--line:#47444c;--acc:#e8938b;--ok:#7fe0a8;--okbg:#1d3a2b;--bad:#ff9a9a;--badbg:#401f21}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:22px/1.6 Verdana,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.top{color:var(--mute);font-size:18px;display:flex;justify-content:space-between;align-items:center}
.bar{height:10px;background:var(--line);border-radius:6px;margin:6px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:28px;margin:.1em 0 .4em}
h2{font-size:26px;margin:0 0 .4em;color:var(--acc)}
p{margin:.4em 0}
img{display:block;max-width:100%;width:200px;height:auto;border-radius:10px;margin:0 auto 12px;border:2px solid var(--line)}
label{display:block;font-size:20px;margin:.6em 0 .2em}
input{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{display:block;width:100%;min-height:58px;font:inherit;font-weight:bold;border-radius:12px;border:2px solid var(--acc);background:var(--card);color:var(--ink);padding:10px 14px;margin:10px 0;cursor:pointer;text-align:left}
button.main{background:var(--acc);color:#fff;text-align:center}
button.say{background:transparent;color:var(--acc);text-align:center;min-height:50px}
button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.q{font-weight:bold;margin-top:.8em}
.fb{min-height:1.6em;font-weight:bold}
.stars{font-size:34px;text-align:center}
textarea{width:100%;min-height:150px;font:14px/1.4 ui-monospace,Consolas,monospace;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.small{font-size:17px;color:var(--mute)}
</style>
</head>

var app = document.getElementById("app");

function say(t){ if(!canSay) return; try{ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = "uk-UA"; u.rate = .85; speechSynthesis.speak(u); }catch(e){} }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function head(){ var n = st.i, w = Math.round(Math.min(n,5)/5*100);
  return '<div class="top"><span>' + (n>=1&&n<=5 ? "Крок "+n+" з 5" : "") + '</span><span>' + "⭐".repeat(st.done.reduce(function(a,b){return a+b;},0)) + '</span></div><div class="bar"><i style="width:'+w+'%"></i></div>'; }

function render(){
  var n = st.i, h = head();
  if(n === 0){
    h += '<div class="card"><h1>Доля однієї людини</h1><p>Ми дізнаємось про Василя Липківського. Це тема про минуле, вона може бути сумною. Можна зробити паузу в будь-який момент.</p><label for="fn">Твоє ім’я</label><input id="fn" value="'+esc(st.fn)+'" autocomplete="given-name"><label for="ln">Прізвище</label><input id="ln" value="'+esc(st.ln)+'" autocomplete="family-name"><div class="fb" id="fb"></div><button class="main" id="go">Починаємо</button></div>';
    app.innerHTML = h;
    document.getElementById("go").onclick = function(){
      st.fn = document.getElementById("fn").value.trim(); st.ln = document.getElementById("ln").value.trim();
      if(!st.fn || !st.ln){ var f = document.getElementById("fb"); f.style.color = "var(--bad)"; f.textContent = "Напиши ім’я та прізвище."; return; }
      st.i = 1; render();
    };
    return;
  }
  if(n > 5){ finish(h); return; }
  var s = S[n-1];
  h += '<div class="card"><h2>' + s.t + '</h2>' + (s.img ? '<img src="'+IMG+'" alt="Портрет Василя Липківського">' : '') + '<p>' + s.txt + '</p>' + (canSay ? '<button class="say" id="sp">🔊 Прослухати</button>' : '') + '<p class="q">' + s.q + '</p><div id="opts"></div><div class="fb" id="fb"></div><div id="nx"></div></div>';
  app.innerHTML = h;
  var box = document.getElementById("opts");
  s.o.forEach(function(txt, k){
    var b = document.createElement("button"); b.textContent = txt; box.appendChild(b);
    b.onclick = function(){ pick(n-1, k, b); };
  });
  if(canSay) document.getElementById("sp").onclick = function(){ say(s.txt + " " + s.q + " " + s.o.join(". ")); };
}

function pick(idx, k, b){
  var s = S[idx], fb = document.getElementById("fb");
  st.tries[idx]++; st.ans[idx] = s.o[k];
  if(s.a === -1 || s.a === k){
    b.className = "ok"; fb.style.color = "var(--ok)"; fb.textContent = s.a === -1 ? "Дякуємо, що поділився(-лась)!" : "Правильно! ⭐";
    st.done[idx] = 1;
    var all = document.querySelectorAll("#opts button"); for(var j=0;j<all.length;j++) all[j].disabled = true;

    nx.innerHTML = '<button class="main" id="next">Далі</button>';
    document.getElementById("next").onclick = function(){ st.i++; render(); window.scrollTo(0,0); };
  } else {
    b.className = "no"; fb.style.color = "var(--bad)"; fb.textContent = "Спробуй ще раз 🙂";
  }
}

function report(){
  var t = "ПРАКТИЧНА РОБОТА (адаптована) · Картка: Липківський Василь Костянтинович\n";
  t += "Учень(-ця): " + st.fn + " " + st.ln + "\nДата: " + new Date().toLocaleString("uk-UA") + "\n\n";
  S.forEach(function(s, i){
    var r = s.a === -1 ? "ставлення: «" + st.ans[i] + "»" : "обрано «" + st.ans[i] + "», " + (st.tries[i] === 1 ? "правильно з 1-ї спроби" : "правильно з " + st.tries[i] + " спроб");
    t += "Крок " + (i+1) + " (" + s.t + "): " + r + "\n";
  });
  return t;
}

function finish(h){
  h += '<div class="card"><h1>Молодець!</h1><div class="stars">⭐⭐⭐⭐⭐</div><p>Ти виконав(-ла) всі кроки. Тепер надішли результат вчительці.</p><button class="main" id="cp">Скопіювати результат</button><button class="say" id="dlb" hidden>Завантажити файл</button><div class="fb" id="fb"></div><textarea id="out" readonly></textarea></div>';
  app.innerHTML = h;
  var out = document.getElementById("out"); out.value = report();
  var m = document.getElementById("fb");
  document.getElementById("cp").onclick = function(){
    var ok = function(){ m.style.color = "var(--ok)"; m.textContent = "Скопійовано. Встав у повідомлення вчительці."; };
    var fb = function(){ out.select(); try{ document.execCommand("copy"); ok(); }catch(e){ m.style.color = "var(--bad)"; m.textContent = "Виділи текст нижче й скопіюй."; } };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(out.value).then(ok, fb); } else { fb(); }
  };
  if(st.dl){ var d = document.getElementById("dlb"); d.hidden = false; d.onclick = function(){
    st.dl.save({filename:"robota_" + (st.ln || "uchen").replace(/\s+/g,"_") + ".txt", data:new Blob([out.value],{type:"text/plain"})}).catch(function(){ m.style.color = "var(--bad)"; m.textContent = "Файл не збережено. Скористайся копіюванням."; });
  }; }
}

render();
(async function(){ try{ var d = window.claude && await window.claude.use("downloads"); if(d){ st.dl = d; if(st.i > 5) render(); } }catch(e){} })();
</script>
</body>
