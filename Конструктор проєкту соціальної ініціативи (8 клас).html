<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конструктор проєкту соціальної ініціативи</title>
<style>
:root{--bg:#f5f7f3;--cd:#fff;--tx:#1d2a26;--mu:#5b6b65;--ac:#1f7a5c;--at:#fff;--a2:#e6f3ed;--bd:#d5dfd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#131a17;--cd:#1d2724;--tx:#e8efec;--mu:#9fb0a9;--ac:#4fc19a;--at:#0f1f19;--a2:#1f352c;--bd:#33443d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#131a17;--cd:#1d2724;--tx:#e8efec;--mu:#9fb0a9;--ac:#4fc19a;--at:#0f1f19;--a2:#1f352c;--bd:#33443d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:0 0 4px}h2{font-size:1.2rem;margin:0 0 8px}
.sub{color:var(--mu);margin:0 0 12px;font-size:.92rem}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#pc{font-size:.82rem;color:var(--mu);margin:4px 0 10px}
#nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.st{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:5px 10px;font:inherit;font-size:.82rem;cursor:pointer}
.st i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:.75rem}
.st.dn i{background:var(--ac);color:var(--at)}.st.on{border-color:var(--ac);background:var(--a2);font-weight:600}
#main{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:18px}
.lead{color:var(--mu);margin:0 0 14px}
.f{display:block;margin-bottom:14px}.f b{display:block}.f small{display:block;color:var(--mu);margin-bottom:3px}
input:not([type=checkbox]),textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
textarea{resize:vertical}input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
button{font:inherit;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.card{border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px 6px;text-align:center}
.card span{display:block;font-size:1.7rem}.card.on{border-color:var(--ac);background:var(--a2)}
.ex{margin-bottom:14px}.ex small{display:block;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:16px;padding:4px 12px;font-size:.9rem}
.chip.on{background:var(--a2);border-color:var(--ac);font-weight:600}.ex .chip{display:block;margin-top:5px;text-align:left}
.ck{display:flex;align-items:center;gap:6px;cursor:pointer}
.pv{background:var(--a2);border-left:4px solid var(--ac);border-radius:8px;padding:10px 12px;margin:2px 0 14px}
.rows{display:grid;gap:8px;margin-bottom:8px}.row{display:grid;gap:6px;align-items:center}
.c3{grid-template-columns:2fr 1fr 1fr 34px}.c2{grid-template-columns:1fr 1fr 34px}
.x{border:0;background:none;color:var(--mu);font-size:1rem}
.g,.p{border-radius:8px;padding:8px 14px;border:1px solid var(--ac)}
.g{background:none;color:var(--ac)}.p{background:var(--ac);color:var(--at);font-weight:600}
.nv{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
.tot{font-weight:600;margin:8px 0 14px}
.pass{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--ac);border-radius:10px;padding:14px;margin-bottom:14px;font-size:.93rem}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
@media(max-width:560px){.cards{grid-template-columns:1fr}.c3,.c2{grid-template-columns:1fr 34px}.c3 input:first-child,.c2 input:first-child{grid-column:1}.st span{display:none}}
@media print{.noprint,#nav,.nv,.bar,#pc{display:none!important}#main{border:0;padding:0}.pass{border:0}}
</style></head><body><div class="w">
<div class="noprint"><h1>🧩 Конструктор проєкту</h1>
<p class="sub">Практична робота · Громадянська освіта · 8 клас<br>Концепція проєкту соціальної ініціативи або волонтерського/екологічного заходу для шкільної спільноти</p>
<div class="bar"><i id="bar"></i></div><div id="pc"></div><div id="nav"></div></div>
<div id="main"></div></div>
<script>
const $=s=>document.querySelector(s),K='proj8-constructor';
let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G=k=>(S[k]||'').trim();
const TYPES=[
{id:'soc',e:'🤝',t:'Соціальна ініціатива',ex:['Тиждень доброти для учнів молодших класів','«Банк допомоги»: старшокласники допомагають із навчанням','Куточок дружності та інклюзії в коридорі школи']},
{id:'vol',e:'🧡',t:'Волонтерський захід',ex:['Збір листів і малюнків для захисників','Акція «Книга для бібліотеки»','Допомога місцевому притулку для тварин']},
{id:'eco',e:'🌱',t:'Екологічний захід',ex:['Роздільне збирання паперу й пластику в школі','Висаджування дерев на шкільному подвір’ї','Ярмарок «Друге життя речей»']}];
const SM=['Конкретна','Вимірна','Досяжна','Важлива для громади','Має термін'];
const VAL=['Відповідальність','Солідарність','Повага до довкілля','Активна участь','Рівність та інклюзія','Чесність'];
const RES=['Приміщення','Дозвіл дирекції','Матеріали','Гроші','Техніка','Час учнів','Допомога дорослих','Інформаційна підтримка'];
const ROLES=['Координатор(ка)','Відповідальний(а) за комунікацію','Відповідальний(а) за ресурси','Відповідальний(а) за звіт і фото'];
const RUB=['Проблема підтверджена фактами, а не здогадками','Мета конкретна, вимірна й має термін','План має відповідальних і терміни','Ресурси та бюджет реалістичні','Передбачено ризики й спосіб оцінити успіх'];
const LS={plan:[['a','Що робимо'],['w','Хто відповідає'],['d','Коли']],bud:[['n','Стаття витрат'],['q','К-сть'],['p','Ціна, грн']],risk:[['r','Що може піти не так'],['s','Що зробимо заздалегідь']]};
const fld=(k,l,ph,r,h)=>`<label class="f"><b>${l}</b>${h?`<small>${h}</small>`:''}${r?`<textarea data-k="${k}" rows="${r}" placeholder="${ph}">${esc(S[k])}</textarea>`:`<input data-k="${k}" value="${esc(S[k])}" placeholder="${ph}">`}</label>`;
function rows(l){if(!S[l]||!S[l].length)S[l]=Array.from({length:l=='risk'?2:3},()=>({}));
return `<div class="rows">`+S[l].map((r,i)=>`<div class="row c${LS[l].length}">`+LS[l].map(([c,p])=>`<input data-l="${l}" data-i="${i}" data-c="${c}" placeholder="${p}" value="${esc(r[c])}"${c=='q'||c=='p'?' inputmode="decimal"':''}>`).join('')+`<button class="x" data-act="del" data-l="${l}" data-i="${i}" aria-label="Видалити рядок">✕</button></div>`).join('')+`</div><button class="g" data-act="add" data-l="${l}">+ Додати рядок</button>`}
const chips=(a,k,cls)=>`<div class="chips">`+a.map((x,i)=>`<button class="chip${(S[k]||[])[i]?' on':''}" data-act="tg" data-k="${k}" data-i="${i}">${x}</button>`).join('')+`</div>`;
const filled=(l,c)=>(S[l]||[]).filter(r=>(r[c]||'').trim()).length;
const sum=()=>(S.bud||[]).reduce((s,r)=>s+(parseFloat(String(r.q||'').replace(',','.'))||0)*(parseFloat(String(r.p||'').replace(',','.'))||0),0);
const goal=()=>`До «${G('when')||'…'}» ми ${G('what')||'…'} для ${G('who')||'…'}. Результат: ${G('howmuch')||'…'}.`;
const ST=[
{e:'🔍',t:'Проблема й ідея',ok:()=>S.type&&G('name')&&G('problem')&&G('idea'),h:()=>`<p class="lead">Почни з проблеми, яку ти справді бачиш у школі чи громаді. Добрий проєкт відповідає на питання: «Що не так — і що ми можемо змінити самі?»</p>
<div class="cards">${TYPES.map(t=>`<button class="card${S.type==t.id?' on':''}" data-act="type" data-id="${t.id}"><span>${t.e}</span><b>${t.t}</b></button>`).join('')}</div>
${S.type?`<div class="ex"><small>Для натхнення (натисни — додасться до ідеї):</small>${TYPES.find(t=>t.id==S.type).ex.map((x,i)=>`<button class="chip" data-act="ex" data-i="${i}">${x}</button>`).join('')}</div>`:''}
${fld('name','Робоча назва проєкту','Коротко й зрозуміло')}
${fld('problem','Яку проблему ми помічаємо?','Кого вона стосується? Де й коли проявляється?',3)}
${fld('proof','Звідки ми знаємо, що це проблема?','Опитування, спостереження, розмови, факти',2,'Спирайся на факти, а не на припущення.')}
${fld('idea','Наша ідея: що саме ми зробимо?','',3)}`},
{e:'🎯',t:'Мета й аудиторія',ok:()=>G('who')&&G('what')&&G('howmuch')&&G('when'),h:()=>`<p class="lead">Мета має бути такою, щоб згодом можна було чесно сказати: «Вдалося!» або «Не вдалося».</p>
${fld('who','Для кого проєкт?','напр. учнів 5–6 класів')}${fld('what','Що саме ми зробимо?','напр. організуємо збір макулатури')}
${fld('howmuch','Який результат хочемо (у цифрах)?','напр. зберемо 200 кг')}${fld('when','До якого терміну?','напр. 20 грудня')}
<div class="pv" id="pv"></div>
<b>Перевір мету за SMART:</b><div class="chips">${SM.map((s,i)=>`<label class="chip ck"><input type="checkbox" data-sm="${i}"${(S.sm||[])[i]?' checked':''}> ${s}</label>`).join('')}</div>
<b>Які цінності підтримує проєкт?</b>${chips(VAL,'val')}
${fld('aud','Хто виграє від проєкту, а кого потрібно переконати?','',2)}`},
{e:'🗓️',t:'План дій',ok:()=>filled('plan','a')>=3,h:()=>`<p class="lead">Розбий проєкт на 4–6 кроків. Біля кожного кроку вкажи, хто за нього відповідає і коли він буде виконаний.</p>${rows('plan')}`},
{e:'💰',t:'Ресурси й бюджет',ok:()=>((S.res||[]).some(Boolean)||filled('bud','n')>0)&&G('src'),h:()=>`<p class="lead">Що потрібно, щоб проєкт справді відбувся? Вибери ресурси й оціни витрати (якщо грошей не треба — так і напиши).</p>
${chips(RES,'res')}<b>Витрати</b>${rows('bud')}<div class="tot" id="tot"></div>
${fld('src','Де візьмемо ресурси та кошти?','Власні сили, збір коштів, дозвіл дирекції, партнери…',2)}`},
{e:'👥',t:'Команда й партнери',ok:()=>G('auth')&&G('r0'),h:()=>`<p class="lead">Успіх проєкту залежить від того, чи кожен знає свою роль.</p>
${fld('auth','Назва команди, клас, учасники','')}${ROLES.map((r,i)=>fld('r'+i,r,'Ім’я')).join('')}
${fld('partners','Хто може допомогти? (партнери)','Адміністрація, учнівське самоврядування, батьки, місцеві організації',2)}
${fld('approve','Що й з ким треба погодити до початку?','',2)}${fld('dec','Як команда ухвалюватиме рішення?','Голосування, консенсус…')}`},
{e:'⚠️',t:'Ризики й оцінка',ok:()=>filled('risk','r')>=2&&G('ind')&&G('meth'),h:()=>`<p class="lead">Подумай наперед: що може завадити і як ти дізнаєшся, що проєкт вдався.</p>${rows('risk')}
<div style="height:14px"></div>${fld('ind','За якими ознаками побачимо успіх?','',2)}${fld('meth','Як це виміряємо?','Опитування, лічильник, фото, відгуки',2)}${fld('share','Як розповімо школі про результати?','',2)}`},
{e:'📄',t:'Паспорт проєкту',ok:()=>(S.rb||[]).filter(Boolean).length==RUB.length,h:()=>`<p class="lead noprint">Твій паспорт сформовано автоматично. Перевір його за критеріями, а потім скопіюй або роздрукуй.</p>
<div class="pass" id="ps"></div>
<div class="noprint"><b>Самоперевірка:</b>${RUB.map((r,i)=>`<label class="ck" style="margin:4px 0"><input type="checkbox" data-rb="${i}"${(S.rb||[])[i]?' checked':''}> ${r}</label>`).join('')}
<div class="act"><button class="p" id="cp" data-act="cp">📋 Копіювати текст</button><button class="g" data-act="pr">🖨️ Друк</button><button class="g" data-act="rs">Почати спочатку</button></div></div>`}];
function pass(){const t=TYPES.find(x=>x.id==S.type),L=[],a=(h,v)=>{if(v&&String(v).trim())L.push(h+': '+String(v).trim())};
L.push('ПАСПОРТ ПРОЄКТУ: '+(G('name')||'без назви'));a('Команда',S.auth);a('Тип',t&&t.t);L.push('');
a('Проблема',S.problem);a('Підтвердження',S.proof);a('Ідея',S.idea);
if(G('who')||G('what'))L.push('Мета: '+goal());
const v=VAL.filter((x,i)=>(S.val||[])[i]);if(v.length)a('Цінності',v.join(', '));a('Хто виграє / кого переконати',S.aud);
const p=(S.plan||[]).filter(r=>(r.a||'').trim());if(p.length){L.push('','План дій:');p.forEach((r,i)=>L.push(` ${i+1}. ${r.a}${r.w?' — '+r.w:''}${r.d?', '+r.d:''}`))}
const rs=RES.filter((x,i)=>(S.res||[])[i]);if(rs.length)L.push('','Потрібні ресурси: '+rs.join(', '));
const b=(S.bud||[]).filter(r=>(r.n||'').trim());if(b.length){L.push('Бюджет:');b.forEach(r=>L.push(` • ${r.n}: ${r.q||'?'} × ${r.p||'?'} грн`));L.push(` Разом: ${sum()} грн`)}
a('Джерела ресурсів',S.src);const tm=ROLES.map((r,i)=>G('r'+i)?` • ${r}: ${G('r'+i)}`:'').filter(Boolean);if(tm.length)L.push('','Ролі:',...tm);
a('Партнери',S.partners);a('Треба погодити',S.approve);a('Ухвалення рішень',S.dec);
const k=(S.risk||[]).filter(r=>(r.r||'').trim());if(k.length){L.push('','Ризики:');k.forEach(r=>L.push(` • ${r.r}${r.s?' → '+r.s:''}`))}
a('Ознаки успіху',S.ind);a('Як виміряємо',S.meth);a('Як розкажемо школі',S.share);return L.join('\n')}
let cur=+S.cur||0;
function nav(){$('#nav').innerHTML=ST.map((s,i)=>{const o=!!s.ok();return`<button class="st${i==cur?' on':''}${o?' dn':''}" data-act="go" data-i="${i}"><i>${o?'✓':i+1}</i><span>${s.t}</span></button>`}).join('');
const n=ST.filter(s=>s.ok()).length;$('#bar').style.width=n/ST.length*100+'%';$('#pc').textContent=n+' з '+ST.length+' кроків завершено'}
function upd(){nav();const a=$('#pv'),b=$('#tot'),c=$('#ps');if(a)a.textContent=goal();if(b)b.textContent='Разом: '+sum()+' грн';if(c)c.textContent=pass()}
function draw(){$('#main').innerHTML=`<h2>${ST[cur].e} Крок ${cur+1}. ${ST[cur].t}</h2>`+ST[cur].h()+`<div class="nv noprint">${cur?`<button class="g" data-act="go" data-i="${cur-1}">← Назад</button>`:'<span></span>'}${cur<ST.length-1?`<button class="p" data-act="go" data-i="${cur+1}">Далі →</button>`:''}</div>`;upd()}
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(d.k)S[d.k]=t.value;else if(d.l)S[d.l][+d.i][d.c]=t.value;else if(d.sm!=null)(S.sm=S.sm||[])[+d.sm]=t.checked;else if(d.rb!=null)(S.rb=S.rb||[])[+d.rb]=t.checked;else return;save();upd()});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset,a=d.act;
if(a=='go'){cur=+d.i;S.cur=cur;scrollTo(0,0)}
else if(a=='type')S.type=d.id;
else if(a=='ex'){const x=TYPES.find(t=>t.id==S.type).ex[+d.i];S.idea=(S.idea?S.idea+'\n':'')+x}
else if(a=='tg'){const r=S[d.k]=S[d.k]||[];r[+d.i]=!r[+d.i]}
else if(a=='add')S[d.l].push({});
else if(a=='del')S[d.l].splice(+d.i,1);
else if(a=='pr'){window.print();return}
else if(a=='cp'){const x=pass();try{await navigator.clipboard.writeText(x)}catch(_){const t=document.createElement('textarea');t.value=x;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(__){}t.remove()}b.textContent='Скопійовано ✓';setTimeout(()=>b.textContent='📋 Копіювати текст',1800);return}
else if(a=='rs'){if(!b.dataset.s){b.dataset.s=1;b.textContent='Натисни ще раз, щоб очистити все';return}S={};cur=0;scrollTo(0,0)}
save();draw()});
draw();
</script></body></html>
