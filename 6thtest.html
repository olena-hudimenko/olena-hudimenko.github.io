<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Підсумкова робота · Історія України · 6 клас</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f5ef;--fg:#222;--card:#fff;--mut:#666;--ac:#1d5fa8;--bd:#d9d4c7;--ok:#1b7a3d;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a1f;--fg:#e8e6e1;--card:#21252c;--mut:#a09d96;--ac:#6fb0f0;--bd:#3a3f48;--ok:#5fcf86;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a1f;--fg:#e8e6e1;--card:#21252c;--mut:#a09d96;--ac:#6fb0f0;--bd:#3a3f48;--ok:#5fcf86;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}.sub{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:14px 0}
.card h2{font-size:1.02rem;margin:0 0 8px}.pts{color:var(--mut);font-weight:400;font-size:.85rem;white-space:nowrap}
label.o{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
label.o:hover{background:rgba(127,127,127,.12)}
input[type=text],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
textarea,input.w{width:100%}
table{border-collapse:collapse;width:100%}td{padding:6px 4px;vertical-align:middle}
td img{width:150px;max-width:100%;border-radius:8px;display:block}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:8px 0}.imgs img{width:100%;border-radius:8px}
.opts{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--ac);background:rgba(127,127,127,.08);border-radius:6px}
.map{border:2px dashed var(--bd);border-radius:10px;padding:24px;text-align:center;color:var(--mut);margin:8px 0}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.ok{color:var(--ok)}.bad{color:var(--bad)}.t{display:none}.teacher .t{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 200px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tools button{background:transparent;color:var(--fg);border:2px solid var(--bd);padding:6px 10px;font-size:.85rem}
.tools button.on{border-color:var(--ac);background:rgba(127,127,127,.15)}
.mw{position:relative;line-height:0;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:#fff}
.mw img,.mw canvas{width:100%;display:block}
.mw canvas{position:absolute;inset:0;cursor:crosshair}
button.g{background:transparent;color:var(--fg);border:1px solid var(--bd);margin:6px 6px 0 0}
</style></head><body><main>

</main>

const mb=document.getElementById('mapbox');
mb.innerHTML='<div class="tools" id="tl"></div><div class="mw"><img src="'+MI+'" alt="Контурна карта України"><canvas id="mc" width="773" height="513"></canvas></div><p class="sub" id="mh"></p><button class="g" onclick="mUndo()">Скасувати крок</button><button class="g" onclick="mClear()">Очистити цей інструмент</button><div class="t"><p class="sub">Режим вчителя: вставте код карти учня.</p><input type="text" class="w" id="mcode" placeholder="Код карти"><button class="g" onclick="mLoad(document.getElementById(\'mcode\').value)">Показати</button></div>';
const mc=document.getElementById('mc');
function setTool(t){tool=t;document.getElementById('tl').innerHTML=Object.keys(TL).map(k=>'<button class="'+(k==t?'on':'')+'" onclick="setTool(\''+k+'\')"><span style="color:'+TL[k][1]+'">●</span> '+TL[k][0]+'</button>').join('');document.getElementById('mh').textContent=TL[t][2];}
function draw(){const x=mc.getContext('2d'),W=mc.width,H=mc.height;x.clearRect(0,0,W,H);
 function dot(q,col,r){x.beginPath();x.arc(q[0]*W,q[1]*H,r,0,7);x.fillStyle=col;x.fill();x.lineWidth=2;x.strokeStyle='#fff';x.stroke();}
 function poly(p,col){if(!p.length)return;x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0]*W,q[1]*H):x.moveTo(q[0]*W,q[1]*H));if(p.length>2){x.closePath();x.globalAlpha=.25;x.fillStyle=col;x.fill();x.globalAlpha=1;}x.lineWidth=2.5;x.strokeStyle=col;x.stroke();p.forEach(q=>dot(q,col,3.5));}
 poly(M.b,TL.b[1]);poly(M.d,TL.d[1]);M.a.forEach(q=>dot(q,TL.a[1],7));if(M.c)dot(M.c,TL.c[1],8);}
mc.addEventListener('click',e=>{const r=mc.getBoundingClientRect();const p=[+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.height).toFixed(4)];
 if(tool=='a'){if(M.a.length>=2)M.a.shift();M.a.push(p);}else if(tool=='c')M.c=p;else M[tool].push(p);draw();});
function mUndo(){if(tool=='a')M.a.pop();else if(tool=='c')M.c=null;else M[tool].pop();draw();}
function mClear(){if(tool=='a')M.a=[];else if(tool=='c')M.c=null;else M[tool]=[];draw();}
function mapCode(){return btoa(JSON.stringify(M));}
function mLoad(c){try{const o=JSON.parse(atob(c.trim()));M.a=o.a||[];M.b=o.b||[];M.c=o.c||null;M.d=o.d||[];draw();}catch(e){alert('Невірний код карти');}}

function val(x){
 if(x.k=='single'){const c=document.querySelector('input[name=t'+x.n+']:checked');return [c?c.value:''];}
 return x.rows.map((_,i)=>document.getElementById('t'+x.n+'_'+i).value);

 T.forEach(x=>{

  const r=document.getElementById('r'+x.n);
  const ok=v.filter((a,i)=>a===key[i]).length;
  r.innerHTML='Збігів з ключем: <b class="'+(ok==key.length?'ok':'bad')+'">'+ok+' з '+key.length+'</b> · ключ: '+key.join(', ');
 });
 s+='КОД КАРТИ (7.1–7.3): '+mapCode()+'\n7.4. '+(document.getElementById('a74').value||'—')+'\n8. '+(document.getElementById('a8').value||'—')+'\n';

 o.innerHTML='<p>Скопіюй цей текст і надішли вчителеві:</p><textarea id="res" rows="10" readonly></textarea>';

 try{navigator.clipboard&&navigator.clipboard.writeText(s)}catch(e){}
}
